server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend. ${BACKEND_URL} is substituted at container
    # start by nginx's envsubst entrypoint (this file is mounted as a template):
    #   - docker compose:  http://backend:8000  (the compose service name)
    #   - kubernetes:      http://<release>-backend.<namespace>.svc.cluster.local:8000
    # No trailing slash, so the original /api/... path is forwarded unchanged.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /api/build/* generates the sample cloud + precomputes every view server-
        # side; a large sample count can take ~30s, so keep a generous read timeout.
        proxy_read_timeout 300s;
        # Uploaded polytopes are small (~tens of KB), but raise nginx's 1 MB default
        # for headroom so an upload is never rejected with 413.
        client_max_body_size 32m;
    }
}
