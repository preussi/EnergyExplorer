services:
  backend:
    build: ./backend
    # The polytope is baked into the image and PCA runs live, so the only thing
    # worth persisting is the per-user dataset sessions (a few KB each) — mount
    # them so a `docker compose up --build` doesn't send everyone back to the
    # landing page.
    volumes:
      - ./backend/sessions:/app/sessions
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      # nginx proxies /api to this target (the backend compose service).
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
