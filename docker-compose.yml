services:
  backend:
    build: ./backend
    # The sample data is baked into the image (see backend/Dockerfile). Only the
    # projection cache is mounted so t-SNE/UMAP builds persist across rebuilds.
    volumes:
      - ./backend/cache:/app/cache
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      # nginx proxies /api to this target (the backend compose service).
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
