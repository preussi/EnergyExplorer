services:
  backend:
    build: ./backend
    volumes:
      - ./data:/data:ro
      - ./backend/cache:/app/cache
    environment:
      DATA_DIR: /data
      CACHE_DIR: /app/cache
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

